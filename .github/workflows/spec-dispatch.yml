name: Notify SDKs of spec release

# When this repo cuts a release (release-please merges the release PR, which
# tags vX.Y.Z, cuts a GitHub Release, and attaches openapi.json), fan out a
# `repository_dispatch` to every downstream SDK so each can auto-pick-up the
# new spec when it's NON-BREAKING (oasdiff-gated in the SDK) and route breaking
# changes to a human. See ENG-3563 for the full design.
#
# Each target's `spec-autobump.yml` handles the `spec-released` event type and
# reads `client_payload.tag` to know which release to evaluate. Targets also run
# a daily scheduled poll as a fallback, so a dropped dispatch self-heals within
# a day — this dispatch is the fast path, not the only path.
#
# Note what a 204 from a target does NOT prove: `POST /dispatches` returns 204
# whether or not any workflow listens for the event type. A target with no
# handler on its default branch therefore produces a GREEN leg that did nothing.
# So the matrix below lists only repos whose `spec-autobump.yml` is confirmed on
# `main` — adding an unwired repo would make this workflow report success while
# that repo is still only reachable by its daily poll.
#
# Auth: `secrets.SDK_DISPATCH_TOKEN` is a scoped token with `contents: write`
# (or the dispatch permission) on the target repos, provisioned by ENG-4149.
# The default GITHUB_TOKEN cannot dispatch to other repositories. Token scope is
# the one thing that genuinely fails a leg (403/404), so it fails loudly below.
#
# How this workflow is reached (ENG-8866)
#
# `release-please.yml` CALLS this workflow (`workflow_call`) in the same run that
# cuts the release. That is the real path, and it is deliberate: the Release is
# created by the default GITHUB_TOKEN, and GitHub does not start workflow runs
# from events created by that token (the recursion guard). So the `release:
# published` trigger below CANNOT fire for a release-please release — this file
# sat on `main` from 2026-06-26 through six releases (v0.7.0 … v0.8.1) with
# literally zero runs. Calling the workflow removes the event from the loop
# entirely, so no credential is needed to make the fan-out start.
#
# The `release: published` trigger is kept anyway, because it is not dead in
# general: a release published by a HUMAN (UI or `gh release create`) does
# deliver the event, and release-please is not involved in that path, so the two
# never both fire today. ⚠️ If release-please.yml is ever changed to cut releases
# under a PAT or App-installation token, the event WOULD start firing and every
# release would fan out twice — at that point drop one of the two paths.
#
# ⚠️ ONE PREREQUISITE IS STILL NOT MET (ENG-4149, verified 2026-08-14):
# `SDK_DISPATCH_TOKEN` is not set on this repo — no repo secret, and no org
# secret visible to it. Every leg now fails fast with the explicit error below,
# and because this workflow is called from release-please.yml that failure turns
# the release run itself red on the release commit instead of being invisible.
# The release is still cut correctly; only the fast-path fan-out is skipped, and
# each SDK's daily poll picks the spec up within a day regardless.

on:
  release:
    types: [published]
  # Called by release-please.yml immediately after a release is cut. This is the
  # trigger that actually runs for a release-please release; see the note above.
  workflow_call:
    inputs:
      tag:
        description: "Spec release tag to fan out (e.g. v0.7.2)."
        required: true
        type: string
  # Manual path: re-run the fan-out for a tag whose legs failed (e.g. the token
  # was not yet scoped to one target), or fan out a tag released before this
  # wiring existed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Spec release tag to fan out (e.g. v0.7.2)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Keyed on the resolved tag so a manual re-run queues behind the release-driven
  # run for that same tag instead of racing it. Distinct tags still fan out
  # concurrently, and nothing is cancelled — a half-delivered fan-out is worse
  # than a slow one, since the undelivered targets fall back to the daily poll.
  # `inputs.tag` covers both workflow_call and workflow_dispatch; it is null on a
  # `release` event, where the tag comes from the release payload instead.
  group: spec-dispatch-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  dispatch:
    # A prerelease must never advance an SDK's pin — the SDKs pin stable spec
    # releases. `release: published` fires for prereleases too, so exclude them
    # here rather than relying on every handler to notice. On the workflow_call
    # and workflow_dispatch paths there is no release payload to inspect, and the
    # vX.Y.Z tag validation below is what keeps a prerelease tag out (it rejects
    # anything with a `-rc.N` suffix).
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    strategy:
      # One target failing (e.g. token not yet scoped to it) must not block the
      # others; the daily poll fallback in each SDK covers a missed dispatch.
      fail-fast: false
      matrix:
        target:
          - nexus-xyz/nexus-exchange-rs
          - nexus-xyz/nexus-exchange-py
          - nexus-xyz/nexus-exchange-mcp
          - nexus-xyz/nexus-exchange-ts
          # NOT nexus-exchange-cli, deliberately: it wraps nexus_exchange rather
          # than implementing the spec, so a spec release gives it nothing to act
          # on. Its chain is api -> rs -> cli, and it follows crates.io for
          # `nexus-exchange` releases instead (sdk-autobump.yml, ENG-7962). Its
          # CI now fails if `.api-version` disagrees with the crate's own pin, so
          # a spec-driven bump there would be rejected rather than merged. Please
          # do not re-add it.
          #
          # And the monorepo re-vendor leg: it vendors the spec instead of
          # pinning a tag, so it needs a different handler (runs
          # eng/apps/exchange/scripts/bump-api-spec.sh <tag>) rather than a
          # matrix row. Filed separately — see rs's
          # docs/spec-autobump-replication.md:
          #   - nexus-xyz/nexus
    steps:
      - name: Dispatch spec-released to ${{ matrix.target }}
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN }}
          TARGET: ${{ matrix.target }}
          # Passed via env (not interpolated into the script body) so the tag is
          # data, not code. The release tag_name and the workflow_call input are
          # repo-controlled, but the workflow_dispatch input is whatever a human
          # typed — hence the validation below.
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::SDK_DISPATCH_TOKEN is not set. It is provisioned by ENG-4149;" \
                 "the workflow cannot dispatch to ${TARGET} without it."
            exit 1
          fi
          # Validating here means a typo'd manual tag fails once, before it
          # reaches a URL, a branch name, or a file in four repos.
          #
          # Deliberately STRICTER than the handlers, which all accept
          # `^v[0-9]+(\.[0-9]+){0,2}$` and so let `v1` and `v0.7` through. Every
          # release this repo has ever cut is three-component (release-please
          # emits nothing else), so a partial tag is always a typo — and one that
          # the loose shape would wave through here AND at all four handlers,
          # only to fail in each of them when the spec is fetched at a tag that
          # does not exist. Rejecting it here is the difference between one red
          # leg at the source and four red legs in four repos.
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Strip control characters and bound the length before echoing the
            # rejected value: a `::error::` line built from an unvalidated tag
            # would otherwise let an embedded newline inject further workflow
            # commands into the log.
            safe_tag=$(printf '%s' "${TAG}" | tr -d '\000-\037' | cut -c1-64)
            echo "::error::refusing to dispatch a tag that is not vX.Y.Z: '${safe_tag}'"
            exit 1
          fi
          echo "Dispatching spec-released (tag=${TAG}) to ${TARGET}"
          gh api "repos/${TARGET}/dispatches" \
            --method POST \
            -f event_type="spec-released" \
            -F "client_payload[tag]=${TAG}"

      # A red job is only a signal if someone reads it, and nobody is emailed
      # about a bot-triggered run. Writing the outcome to the run summary puts a
      # plain-language line on the release run itself — including on green, so
      # silence is distinguishable from success — and says explicitly that a
      # failed fan-out does NOT mean the release failed.
      - name: Record outcome in the run summary
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          set -euo pipefail
          # Same sanitising as the dispatch step: the tag reaches the summary on
          # the failure path too, and the workflow_dispatch input is untrusted.
          safe_tag=$(printf '%s' "${TAG:-<unset>}" | tr -d '\000-\037' | cut -c1-64)
          # Backticks are escaped rather than single-quoted so they stay Markdown
          # and are not read as command substitution.
          if [ "${OUTCOME}" = "success" ]; then
            printf -- "- \`%s\` — dispatched \`spec-released\` for \`%s\`.\n" \
              "${TARGET}" "${safe_tag}" >> "$GITHUB_STEP_SUMMARY"
          else
            printf -- "- \`%s\` — **NOT dispatched** (\`%s\`) for \`%s\`. The release itself is fine; this SDK falls back to its daily poll and picks the spec up within a day. See the job log, and ENG-4149 if \`SDK_DISPATCH_TOKEN\` is still unprovisioned.\n" \
              "${TARGET}" "${OUTCOME}" "${safe_tag}" >> "$GITHUB_STEP_SUMMARY"
          fi
