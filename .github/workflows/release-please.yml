name: release-please

# This repo PUBLISHES the Nexus Exchange API spec; it does not author it. The
# source of truth is the Nexus monorepo, at `eng/apps/exchange/api/openapi.json`
# (ENG-5886 / EDR-010, which superseded EDR-001 — this repo used to be canonical
# and the monorepo vendored a released tag from it). `openapi.json` arrives here
# as a PR from the monorepo publish bot after a production deploy, and this
# workflow turns those merged commits into the tag the SDKs pin. See
# CONTRIBUTING.md, and `spec-source-of-truth.yml` for the guard.
#
# release-please still owns the version, and is the ONLY actor that should write
# it. Publish PRs land on main WITHOUT bumping it — the publish bot pins
# info.version to the currently-published value precisely so it stays out of the
# diff, and the conventional commit type it classifies from the diff carries the
# intent instead (feat: / fix: -> patch, feat! or BREAKING CHANGE -> minor,
# pre-1.0). release-please accumulates them into a running release PR. Merging
# that release PR is the deliberate, batched release: it bumps openapi.json's
# info.version, updates CHANGELOG.md, tags vX.Y.Z, cuts a GitHub Release, and
# attaches openapi.json as a release asset.

on:
  push:
    branches:
      - main
  # Manual trigger — regenerate the release PR without a new push
  # (e.g. after closing a release PR).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Consumed by the spec-dispatch job below.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Attach openapi.json as a downloadable release asset. Consumers (SDK,
      # external integrators) pull the spec from the release rather than
      # vendoring it, so GitHub's asset download_count gives us an adoption
      # signal. Only runs when a release was just created.
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
      - if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" openapi.json --clobber

  # Fan the release out to the downstream SDKs (ENG-8866).
  #
  # `spec-dispatch.yml` also declares `on: release: [published]`, but that event
  # can never be delivered for the release cut above: release-please creates it
  # with the default GITHUB_TOKEN, and GitHub does not start workflow runs from
  # events created by that token. The workflow consequently had zero runs across
  # six releases. Calling it directly is preferred over handing release-please a
  # PAT or App-installation token, because it needs no credential at all — the
  # fan-out simply becomes part of this run.
  #
  # It also fixes the visibility half: a failed leg now turns THIS run red on the
  # release commit, where a failure of a separate never-triggered workflow was
  # unobservable by construction.
  spec-dispatch:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/spec-dispatch.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # spec-dispatch.yml needs SDK_DISPATCH_TOKEN, which a called workflow cannot
    # see unless it is passed in.
    secrets: inherit
