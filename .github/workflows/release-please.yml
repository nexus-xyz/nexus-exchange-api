name: release-please

# This repo PUBLISHES the Nexus Exchange API spec; it does not author it. The
# source of truth is the Nexus monorepo, at `eng/apps/exchange/api/openapi.json`
# (ENG-5886 / EDR-010, which superseded EDR-001 — this repo used to be canonical
# and the monorepo vendored a released tag from it). `openapi.json` arrives here
# as a PR from the monorepo publish bot after a production deploy, and this
# workflow turns those merged commits into the tag the SDKs pin. See
# CONTRIBUTING.md, and `spec-source-of-truth.yml` for the guard.
#
# WHO OWNS THE VERSION NUMBER. Not this workflow — the monorepo does, since
# ENG-11154. `info.version` moves in the monorepo PR that changes the contract,
# by the bump rule in `eng/apps/exchange/api/README.md`, and every layer that
# announces the version moves with it there. So a publish PR ARRIVES here with
# info.version already bumped, and its commit carries a `Release-As: X.Y.Z`
# footer naming that same number. release-please obeys the footer rather than
# deriving its own answer, which is the point: two actors computing a version
# from the same diff is exactly the divergence the rule exists to stop.
#
# An earlier revision of this comment said the opposite — that release-please
# owned the number and the bot pinned info.version to the published value to keep
# it out of the diff. That was true before ENG-11154 and is not now (raised in
# review of #81); reading it that way in the monorepo fails the required
# `Exchange API Spec` bump-rule check there.
#
# What release-please still owns is the RELEASE: it accumulates merged commits
# into a running release PR, and merging that PR is the deliberate, batched
# release — it reconciles openapi.json's info.version via `extra-files` (usually
# a no-op now, since the publish already carried the number), updates
# CHANGELOG.md, tags vX.Y.Z, cuts a GitHub Release, attaches openapi.json as a
# release asset, and fans out to the SDKs below.
#
# The conventional commit type still decides WHETHER a release is cut and what
# the changelog says (feat: / fix: -> patch, feat! or BREAKING CHANGE -> minor,
# pre-1.0). For a repo-local PR that touches no spec — docs, CI — there is no
# `Release-As:` footer and release-please derives the number as it always did.

on:
  push:
    branches:
      - main
  # Manual trigger — regenerate the release PR without a new push
  # (e.g. after closing a release PR).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Consumed by the spec-dispatch job below.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Attach openapi.json as a downloadable release asset. Consumers (SDK,
      # external integrators) pull the spec from the release rather than
      # vendoring it, so GitHub's asset download_count gives us an adoption
      # signal. Only runs when a release was just created.
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
      - if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" openapi.json --clobber

  # Fan the release out to the downstream SDKs (ENG-8866).
  #
  # `spec-dispatch.yml` also declares `on: release: [published]`, but that event
  # can never be delivered for the release cut above: release-please creates it
  # with the default GITHUB_TOKEN, and GitHub does not start workflow runs from
  # events created by that token. The workflow consequently had zero runs across
  # six releases. Calling it directly is preferred over handing release-please a
  # PAT or App-installation token, because it needs no credential at all — the
  # fan-out simply becomes part of this run.
  #
  # It also fixes the visibility half: a failed leg now turns THIS run red on the
  # release commit, where a failure of a separate never-triggered workflow was
  # unobservable by construction.
  spec-dispatch:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/spec-dispatch.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # spec-dispatch.yml needs SDK_DISPATCH_TOKEN, which a called workflow cannot
    # see unless it is passed in.
    secrets: inherit
