name: Spec inaccuracy
description: Report where openapi.json disagrees with the actual API behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! This repo publishes the **API spec**
        (`openapi.json`); it is not an SDK. Use this template when the spec is
        wrong — a field, type, endpoint, or status code that doesn't match how
        the live API actually behaves. Please search existing issues first to
        avoid duplicates.

        **An issue is the way to fix this, and the only way.** `openapi.json`
        here is generated from `eng/apps/exchange/api/openapi.json` in
        `nexus-xyz/nexus` and republished after every production deploy, so a
        pull request against this repo cannot be merged — it would be overwritten
        by the next publish, and human-authored PRs here are closed
        automatically. Filing this issue is not the slow path: we correct the
        spec at the source and it reaches you in the next published release.
  - type: input
    id: endpoint
    attributes:
      label: Endpoint / field
      description: The operation, path, or schema field the spec gets wrong.
      placeholder: "POST /orders — `quantity` field"
    validations:
      required: true
  - type: textarea
    id: spec-says
    attributes:
      label: What the spec says
      description: Quote or describe what openapi.json currently documents.
      placeholder: "`quantity` is typed as `number`."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual API behavior
      description: What the live API actually does, and how you observed it.
      placeholder: "The API rejects numbers and requires a decimal string, e.g. `\"0.01\"`."
    validations:
      required: true
  - type: input
    id: spec-version
    attributes:
      label: Spec version
      description: >-
        Value of `$.info.version` in openapi.json, or the release tag you're
        looking at.
      placeholder: "0.4.0 (or v0.4.0)"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        A request/response pair (curl is great) that demonstrates the mismatch.
        Redact any secrets, tokens, or signatures.
      render: text
    validations:
      required: false
